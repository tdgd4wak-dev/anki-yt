<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Anki YouTube player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #ccc; font: 14px -apple-system, sans-serif; text-align: center; margin-top: 40%; }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get("v") || "";
  var start = q.get("start") || "";
  var end = q.get("end") || "";
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) {
    document.body.innerHTML = "<p>動画IDが正しくありません</p>";
  } else {
    var params = new URLSearchParams({ playsinline: "1", rel: "0" });
    if (/^\d+$/.test(start)) params.set("start", start);
    if (/^\d+$/.test(end)) params.set("end", end);
    var f = document.createElement("iframe");
    f.src = "https://www.youtube.com/embed/" + v + "?" + params.toString();
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.referrerPolicy = "strict-origin-when-cross-origin";
    f.allowFullscreen = true;
    document.body.appendChild(f);
  }
</script>
</body>
</html>
