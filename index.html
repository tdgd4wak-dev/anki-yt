<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Anki YouTube player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe, #player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #ccc; font: 14px -apple-system, sans-serif; text-align: center; margin-top: 40%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get("v") || "";
  var start = /^\d+$/.test(q.get("start") || "") ? parseInt(q.get("start"), 10) : 0;
  var end = /^\d+$/.test(q.get("end") || "") ? parseInt(q.get("end"), 10) : 0;
  var player, timer;

  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) {
    document.body.innerHTML = "<p>動画IDが正しくありません</p>";
  } else {
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(s);
  }

  // 1回だけ読み込み、区間の終わりでは「止めて頭に戻す」だけにする（読み込み直さない）
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: v,
      width: "100%",
      height: "100%",
      playerVars: { playsinline: 1, rel: 0, start: start, origin: location.origin },
      events: { onStateChange: onState }
    });
  }

  function onState(e) {
    clearInterval(timer);
    if (e.data === YT.PlayerState.PLAYING && end > start) {
      timer = setInterval(function () {
        if (player.getCurrentTime() >= end) {
          clearInterval(timer);
          player.pauseVideo();
          player.seekTo(start, true);
        }
      }, 200);
    }
  }
</script>
</body>
</html>
